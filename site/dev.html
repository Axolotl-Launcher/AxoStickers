<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>预览对照（开发用）</title>
<style>
  body { font: 14px system-ui; margin: 16px; background: #eef6ff; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: flex-start; }
  .row canvas, .row img { width: 200px; height: 200px; background: #fff; }
  .row b { width: 120px; }
</style>
</head>
<body>
<p>左：网页预览（three.js 版，组件化引擎）；右：Python 引擎同一帧（先跑 python site/tools/ref_frames.py）。</p>
<div id="rows"></div>
<script type="module">
import './src/gen/fonts.css';
import { W, FPS, Scene, fromRecipe, builtinRegistry, loadFont, renderer } from './src/engine/index.js';
const refs = await (await fetch('_ref/index.json')).json();
const reg = builtinRegistry(), R = renderer();
window.__diffs = [];
for (const r of refs) {
  const s = r.spec;
  await loadFont(s.text);
  const params = Object.fromEntries(['n', 's', 'debris', 'dir', 'flip', 'seed'].filter((k) => s[k] !== undefined).map((k) => [k, s[k]]));
  const P = fromRecipe({ ...s, hold: typeof s.hold === 'string' ? s.hold : s.hold?.kind, params });
  if (s.idle) P.idle = { ...P.idle, ...s.idle };
  P.seed = s.seed;
  const scene = new Scene(P, reg, R);
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<b>${s.text}<br>${s.motion}</b>`;
  for (const fi of r.frames) {
    const c = document.createElement('canvas'); c.width = c.height = W;
    scene.frame(c.getContext('2d'), fi / FPS);
    const img = document.createElement('img'); img.src = `_ref/${r.name}_${fi}.png`;
    row.append(c, img);
  }
  if (scene.errors.size) row.append(JSON.stringify([...scene.errors]));
  document.getElementById('rows').append(row);
}
</script>
</body>
</html>
