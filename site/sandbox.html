<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 创意工坊的沙盒：所有组件代码（内置的、自己写的、从文件载入的）都只在这里跑。
     它被 <iframe sandbox="allow-scripts"> 打开，是不透明来源：碰不到主页面、存储和 cookie；下面的 CSP 再禁掉联网。
     worker-src blob:：引擎放进这个页面开的 Worker 里跑（不占编辑器界面的线程）；开完以后 sandbox.js 再加一条 worker-src 'none' 封上，组件代码开不了 Worker。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; worker-src blob:; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沙盒</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script src="./sandbox-boot.js"></script>
<script type="module" src="./src/sandbox.js"></script>
</body>
</html>
