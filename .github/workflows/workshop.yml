# 创意工坊：issue 就是投稿。
#   render（没有任何权限）：校验 issue 里的工程 → 构建网站 → 在断网、没有权限的容器里用网页引擎出图。
#     工程可以带别人写的组件代码：只在这一步、浏览器的沙盒页面里跑（site/tools/render.mjs），交回来的只有一张 GIF 和一份报告。
#   publish：从事件里重新读、重新校验工程（不信 render 交回来的任何东西），GIF 用 Pillow 解码检查、重新编码 →
#     提交 GIF、封面、工程和 workshop/index.json → 回复并关掉 issue → 重新部署网站。
# 维护者给投稿 issue 打上 rejected 标签就撤下。
# issue 正文是不可信输入：只由 workshop/tools/workshop.py 从事件文件里读出来当 JSON 校验，从不拼进 shell 命令。
name: 工坊 · 出图

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions: {}

jobs:
  render:
    if: >-
      github.event.action != 'labeled' &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, 'rejected') &&
      (contains(github.event.issue.labels.*.name, 'workshop') || startsWith(github.event.issue.title, '[工坊]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    outputs:
      status: ${{ steps.prep.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 校验工程
        id: prep
        run: python workshop/tools/workshop.py prepare
      - uses: actions/setup-node@v7
        if: steps.prep.outputs.status == 'ok'
        with:
          node-version: 24
      - name: 构建网站（和部署出去的是同一份引擎）
        if: steps.prep.outputs.status == 'ok'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # 浏览器用容器里自带的
        run: |
          pip install -q 'numpy>=2,<3' 'pillow>=11,<13' 'fonttools>=4.50,<5' 'brotli>=1.1'
          python site/tools/make_fonts.py
          python site/tools/export_engine.py
          cd site
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
          mkdir -p dist/models && cp ../kit/model/axolotl_logo.glb ../workshop/models/*.json dist/models/
          cp ../workshop/models/*.glb dist/models/ 2>/dev/null || true   # 工坊里的模型（logo 的文件在 kit/model/）
      - name: 出图（断网、没有权限的容器）
        if: steps.prep.outputs.status == 'ok'
        run: |
          mkdir -p "$RUNNER_TEMP/out" && chmod 777 "$RUNNER_TEMP/out"
          timeout 300 docker run --rm --network none --init --user pwuser --shm-size 1g \
            --cap-drop ALL --security-opt no-new-privileges --memory 4g --pids-limit 512 \
            -v "$PWD/site:/w:ro" -v "$RUNNER_TEMP/job:/job:ro" -v "$RUNNER_TEMP/out:/out" \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            node /w/tools/render.mjs /w/dist /job/project.json /out/out.gif \
            || echo '出图失败，原因写在 out.json 里，publish 会回复给投稿人'
          # 容器里写出来的东西只收两个普通文件（不跟符号链接、限大小）
          mkdir -p "$RUNNER_TEMP/render"
          for f in out.gif out.json; do
            p="$RUNNER_TEMP/out/$f"
            if [ -f "$p" ] && [ ! -L "$p" ] && [ "$(stat -c %s "$p")" -le 4194304 ]; then cp "$p" "$RUNNER_TEMP/render/$f"; fi
          done
          ls -l "$RUNNER_TEMP/render"
      - uses: actions/upload-artifact@v7
        if: steps.prep.outputs.status == 'ok'
        with:
          name: render
          path: ${{ runner.temp }}/render/
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: render
    if: ${{ !cancelled() && needs.render.result != 'skipped' }}
    # 同一个 issue 的发布一次只跑一个（不同 issue 互不影响）：两次运行同时查「回复过没有」会各发一条。
    # 排队时更新的那次会顶掉更早还没开始的那次，正好：要发的就是最新的正文。撤下不进这个组（它不能被顶掉）
    concurrency:
      group: workshop-publish-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # 提交 GIF、封面、工程和 index.json
      issues: write     # 回复、打标签、关 issue
      actions: write    # 触发网站部署
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 依赖（numpy、Pillow）
        run: pip install -q 'numpy>=2,<3' 'pillow>=11,<13'
      - uses: actions/download-artifact@v8
        if: needs.render.outputs.status == 'ok'
        continue-on-error: true            # 没交回东西：publish 会回复「出图失败」
        with:
          name: render
          path: ${{ runner.temp }}/render
      - name: 校验、收图、提交
        id: ws
        env:
          GITHUB_TOKEN: ${{ github.token }}   # 提交前再查一次 issue 有没有被改 / 撤下
        run: python workshop/tools/workshop.py publish --push --from "$RUNNER_TEMP/render"
      - name: 回复 issue
        if: contains(fromJSON('["published", "invalid", "failed", "skip"]'), steps.ws.outputs.status)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.ws.outputs.number }}
          STATUS: ${{ steps.ws.outputs.status }}
          ACTION: ${{ github.event.action }}
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i * 10)); done; return 1; }
          gh label create workshop --color fe3e8c --description '创意工坊投稿' 2>/dev/null || true
          gh label create rejected --color 6e1446 --description '创意工坊：维护者撤下' 2>/dev/null || true
          if [ "$STATUS" = invalid ] || [ "$STATUS" = failed ]; then
            retry gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/workshop/comment.md"
            exit 0
          fi
          # published / skip（已经发过，可能是上次没收尾）：每一步都可以重复做
          posted=$(gh api "repos/$GH_REPO/issues/$NUMBER/comments" --paginate --jq '[.[] | select(.body | contains("<!-- workshop:published -->"))] | length' | awk '{s+=$1} END {print s+0}')
          if [ "$posted" = 0 ]; then retry gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/workshop/comment.md"; fi
          retry gh issue edit "$NUMBER" --add-label workshop
          if [ "$ACTION" != reopened ]; then retry gh issue close "$NUMBER" --reason completed; fi
          retry gh workflow run pages.yml --ref main
      - name: 出错时告诉投稿人
        if: failure() && steps.ws.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$NUMBER" --body '机器人出图时出错了 🫠 维护者会看一下；也可以过会儿随便改一下正文（保存就行）让它重试。'

  reject:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'rejected' &&
      (contains(github.event.issue.labels.*.name, 'workshop') || startsWith(github.event.issue.title, '[工坊]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 撤下
        id: ws
        run: python workshop/tools/workshop.py reject --push
      - name: 回复 issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.ws.outputs.number }}
          STATUS: ${{ steps.ws.outputs.status }}
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i * 10)); done; return 1; }
          if [ "$STATUS" = removed ]; then
            retry gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/workshop/comment.md"
            retry gh workflow run pages.yml --ref main
          fi
          retry gh issue close "$NUMBER" --reason 'not planned'
