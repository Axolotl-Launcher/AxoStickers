# 网站：site/ 构建 + out/ 的表情 + workshop/ 的投稿和组件库 → GitHub Pages。
# 推到 main 时自动跑；工坊出图 / 数点赞之后由那两个工作流用 workflow_dispatch 触发。
name: 网站 · 部署到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'out/**'
      - 'workshop/**'
      - 'engine/**'
      - 'kit/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read       # configure-pages 要读 Pages 设置
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7      # 不用 actions/cache：这个工作流会被工坊投稿触发，缓存是投毒的入口
        with:
          node-version: 24
      - name: 依赖（numpy、Pillow、fonttools、ffmpeg）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          pip install -q 'numpy>=2,<3' 'pillow>=11,<13' 'fonttools>=4.50,<5' 'brotli>=1.1'
      - name: 切字体、导出引擎数据
        run: |
          python site/tools/make_fonts.py
          python site/tools/export_engine.py
      - name: 构建
        working-directory: site
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # playwright 只给工坊出图用
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
      - name: 拼网站（缩略图、悬停预览视频、表情、工坊投稿、组件库）
        run: python site/tools/assemble.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
